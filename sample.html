
<%- include('../partials/admin/header.ejs') %>
  <style>
    :root {
      --primary-bg: #d4c4a8;
      --card-bg: #ffffff;
      --text-dark: #2d2d2d;
      --text-muted: #6c757d;
      --border-color: #e0e0e0;
      --accent-color: #8b7355;
      --accent-hover: #75624a;
    }

    body {
      background-color: var(--primary-bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .main-content {
      padding: 30px;
      margin-left: 250px;
    }

    .page-header {
      margin-bottom: 30px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .breadcrumb {
      background: transparent;
      padding: 0;
      margin-bottom: 0;
      font-size: 14px;
    }

    .breadcrumb-item {
      color: var(--text-muted);
    }

    .breadcrumb-item.active {
      color: var(--accent-color);
    }

    .breadcrumb-item + .breadcrumb-item::before {
      content: "›";
      color: var(--text-muted);
    }

    .breadcrumb-item a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s;
    }

    .breadcrumb-item a:hover {
      color: var(--accent-color);
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      justify-content: flex-end;
    }

    .btn-cancel {
      background-color: white;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-cancel:hover {
      background-color: #f8f9fa;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .btn-update-category {
      background-color: var(--accent-color);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-update-category:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .form-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      animation: slideIn 0.4s ease-out;
    }

    .form-section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 25px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dark);
      margin-bottom: 8px;
      display: block;
    }

    .form-control {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
      outline: none;
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    .form-footer {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid #f0f0f0;
    }

    .btn-submit {
      background-color: var(--accent-color);
      border: none;
      color: white;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(139, 115, 85, 0.3);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .form-card {
        padding: 25px;
      }

      .action-buttons {
        flex-direction: column;
      }

      .btn-cancel, .btn-update-category {
        width: 100%;
        justify-content: center;
      }

      .form-footer {
        flex-direction: column-reverse;
      }

      .btn-submit {
        width: 100%;
      }
    }
  </style>
</head>
<body>
 <%- include('../partials/admin/header.ejs') %>

  <div class="main-content">
    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">Edit Category</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
          <li class="breadcrumb-item"><a href="/admin/category">Categories</a></li>
          <li class="breadcrumb-item active" aria-current="page">Edit Category</li>
        </ol>
      </nav>
    </div>

 

    <!-- Form Card -->
    <div class="form-card">
      <h3 class="form-section-title">Category Details</h3>
      <form id="editCategoryForm" action="/admin/editCategory/<%= category._id %>" method="POST">
        <!-- Category Name -->
        <div class="form-group mb-4">
          <label for="name" class="form-label">Category Name<span class="text-danger">*</span></label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control"
            placeholder="Enter category name"
            value="<%= category.name %>"
            required
          />
        </div>

        <!-- Description -->
        <div class="form-group mb-4">
          <label for="description" class="form-label">Description<span class="text-danger">*</span></label>
          <textarea 
            id="description" 
            name="description" 
            class="form-control"
            placeholder="Enter category description"
            required
          ><%= category.description %></textarea>
        </div>

        <!-- Form Footer -->
        <div class="form-footer">
          <a href="/admin/category" class="btn btn-cancel">
            <i class="fas fa-arrow-left"></i> Back
          </a>
          <button type="submit" class="btn btn-submit">
            <i class="fas fa-save"></i> Update Category
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
